/*/LEON*/
/* Layout: brutalist portfolio, dark. Pure black and white, a ruled grid of equal header cells and numbered sections, square corners, one left edge for everything.
   Type system (Leon Product, embedded and subset: Thin 100 / Regular 400 / Bold 700, English and Hebrew), four sizes only:
   display 700 / title 600 28px / body 400 17px / meta 500 12px caps. Spacing on an 8px grid. */
:root{
  --bg:#000000;
  --fg:#FFFFFF;
  --fg-2:#A3A3A3;
  --fg-3:#6B6B6B;
  --rule:#2A2A2A;
  --field:#474747;
  --danger:#FF5A47;
  --font:"Leon",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --display:clamp(3.2rem, 14.2vw, 6.75rem);
  --title:1.75rem;
  --body:1.0625rem;
  --meta:.75rem;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FFFFFF;
  --fg:#0A0A0A;
  --fg-2:#4D4D4D;
  --fg-3:#757575;
  --rule:#D2D2CC;
  --field:#A3A39D;
  --danger:#D92D1A;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  font-synthesis:none;
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-size:var(--body);
  font-weight:400;
  line-height:1.5;
  letter-spacing:-.011em;
  font-kerning:normal;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding-left:max(20px, env(safe-area-inset-left, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom, 0px));
}
body:lang(he){letter-spacing:0}
::selection{background:var(--fg);color:var(--bg)}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:720px;margin-inline:auto}

/* type roles */
.meta{font-size:var(--meta);font-weight:400;line-height:1;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
:lang(he) .meta{font-size:.8125rem;letter-spacing:0}
.title{margin:0;font-size:var(--display);font-weight:700;line-height:.95;letter-spacing:-.04em;word-spacing:.06em;text-wrap:balance}
:lang(he) .title{font-size:clamp(2.75rem, 13.4vw, 6rem);line-height:1.1;letter-spacing:0;word-spacing:.04em}
:lang(he) .hero{padding-block:32px 40px}
:lang(he) .sub{margin-top:16px;line-height:1.45}
:lang(he) .sec{margin-top:48px}
:lang(he) .sec .h2{margin-top:24px}
:lang(he) .help{margin-top:8px}
:lang(he) .tags{margin-top:24px}
.h2{display:block;margin:0;font-size:var(--title);font-weight:700;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
:lang(he) .h2{letter-spacing:.005em;line-height:1.3}
:lang(he) .sub,:lang(he) .help,:lang(he) .fine,:lang(he) .notice,:lang(he) .field{line-height:1.6}
:lang(he) .tag{line-height:1.35;padding-block:11px}
:lang(he) .meta{line-height:1.2}

/* header: three equal ruled cells */
.hdr{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));border-bottom:1px solid var(--rule)}
.cell{display:flex;align-items:center;min-height:48px}
.cell + .cell{border-inline-start:1px solid var(--rule);padding-inline-start:12px}
.lang{display:flex;gap:10px}
.lang button{padding:10px 0;display:flex;align-items:center;opacity:.4;filter:grayscale(1);transition:opacity .15s,filter .15s}
.lang button:hover{opacity:.75}
.lang button[aria-pressed="true"]{opacity:1;filter:none}
.lang #themeBtn,.lang #themeBtn:hover{opacity:.8;filter:none;margin-inline-start:auto}
.themeic{display:block;width:22px;height:22px;color:var(--fg)}
.flag{display:block;width:24px;height:16px;outline:1px solid var(--rule)}
.lang button[aria-pressed="true"] .flag{outline-color:var(--fg)}
.owner{padding-block:8px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* hero */
.hero{padding-block:40px 56px}
.sub{margin:24px 0 0;color:var(--fg);font-weight:100;font-size:1.5rem;line-height:1.3;letter-spacing:0;max-width:28em;text-wrap:pretty}

/* sections: the top rule turns white while you're writing in that section */
.sec{border-top:1px solid var(--rule);margin-top:64px;transition:border-color .35s ease}
.sec:focus-within{border-top-color:var(--fg)}
.sec:first-child{margin-top:0}
.sec .h2{margin-top:32px}
.help{margin:12px 0 0;color:var(--fg-2);max-width:34em;text-wrap:pretty}

.field{display:block;width:100%;margin-top:24px;padding:16px;border:1px solid var(--field);border-radius:0;background:transparent;color:var(--fg);font:inherit;font-size:var(--body);line-height:1.5;letter-spacing:inherit;resize:none;overflow:hidden;min-height:168px;outline:none;caret-color:var(--fg);transition:border-color .15s,box-shadow .15s;unicode-bidi:plaintext}
.field::placeholder{color:var(--fg-3);opacity:1}
.field:focus{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
input.field{min-height:0;margin-top:16px}
.err{margin:12px 0 0;color:var(--danger)}

/* optional questions as tags; picking one opens its answer box right under that tag */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.tag{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:10px 16px;border:1px solid var(--field);text-align:start;line-height:1.2;transition:background-color .12s,color .12s,border-color .12s}
.tag:hover{border-color:var(--fg)}
.tag[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.icon{flex:none;position:relative;width:10px;height:10px;transition:transform .2s ease}
.icon::before,.icon::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:currentColor}
.icon::after{transform:rotate(90deg)}
.tag[aria-pressed="true"] .icon{transform:rotate(45deg)}
.tags .answer{flex:0 0 100%;margin:0 0 8px}
.answer .field{margin-top:0;min-height:112px}
.answer.fresh{animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* anonymous + send */
.anon-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:32px}
.anon-row label{cursor:pointer}
.sec .anon-row .h2{margin-top:0}
.switch{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:56px;height:32px;margin:0;border:1.5px solid var(--fg);border-radius:0;background:transparent;cursor:pointer;transition:background-color .15s}
.switch::before{content:"";position:absolute;top:4px;inset-inline-start:4px;width:21px;height:21px;background:var(--fg);transition:transform .18s ease,background-color .15s}
.switch:checked{background:var(--fg)}
.switch:checked::before{transform:translateX(24px);background:var(--bg)}
[dir="rtl"] .switch:checked::before{transform:translateX(-24px)}
.anon-note{margin:8px 0 0;color:var(--fg-2)}

.send-meta{display:flex;justify-content:space-between;gap:16px;margin-top:48px;color:var(--fg-2)}
.send-meta #status{color:var(--danger)}
.send-meta #status:empty{display:none}
.saved{color:var(--fg-3)}
.send{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:72px;margin-top:16px;padding-inline:20px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);transition:background-color .12s,color .12s}
.send:hover{background:var(--bg);color:var(--fg)}
.send:disabled{opacity:.6;cursor:progress}
.send svg{flex:none;width:24px;height:24px}
[dir="rtl"] .send svg,[dir="rtl"] .dock-send svg{transform:scaleX(-1)}
.fine{margin:16px 0 0;color:var(--fg-2);font-size:.875rem;line-height:1.45}
.hp{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;clip-path:inset(50%);pointer-events:none}

/* docked send: appears once there's an answer and the main Send is off screen */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--rule);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));transform:translateY(110%);transition:transform .25s ease}
.dock.show{transform:none}
body.typing .dock{transform:translateY(110%)}
.dock-in{max-width:720px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.dock .meta{color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-send{flex:none;display:inline-flex;align-items:center;gap:12px;height:44px;padding-inline:18px;background:var(--fg);color:var(--bg);font-weight:700;border:1px solid var(--fg)}
.dock-send:hover{background:var(--bg);color:var(--fg)}
.dock-send svg{width:18px;height:18px}

/* other views */
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.block-btn{display:inline-flex;align-items:center;height:56px;padding:0 24px;border:1px solid var(--fg);font-weight:700;transition:background-color .12s,color .12s}
.block-btn:hover{background:var(--fg);color:var(--bg)}
.block-btn.solid{background:var(--fg);color:var(--bg)}
.block-btn.solid:hover{background:var(--bg);color:var(--fg)}
.copybox{min-height:14em;resize:vertical}
.notice{margin:16px 0 0;color:var(--fg-2);font-size:.875rem;line-height:1.45}

.resp{border-top:1px solid var(--rule);padding-block:24px 32px}
.resp-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;color:var(--fg-2)}
.resp-who{margin:16px 0 0}
.resp-who.anon{color:var(--fg-2)}
.resp-main{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.resp-a{margin-top:24px}
.resp-a .meta{color:var(--fg-2)}
.resp-a .v{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{margin:0;padding-top:24px;border-top:1px solid var(--rule);color:var(--fg-2)}

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  };
  var DRAFT_KEY = "gf-draft-v5", LANG_KEY = "gf-lang";
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var coarse = window.matchMedia ? window.matchMedia("(pointer: coarse)") : { matches: false };

  // ---------- state ----------
  var lang = store.get(LANG_KEY);
  if (!T[lang]) lang = "en";
  function t(k) { return T[lang][k]; }

  var st = { anon: false, name: "", main: "", picked: [], answers: {} };
  try {
    var d = JSON.parse(store.get(DRAFT_KEY) || "null");
    if (d && typeof d === "object") {
      st.anon = d.anon === true;
      st.name = typeof d.name === "string" ? d.name : "";
      st.main = typeof d.main === "string" ? d.main : "";
      var pk = Array.isArray(d.picked) ? d.picked : (Array.isArray(d.open) ? d.open : []);
      st.picked = pk.filter(function (k) { return KEYS.indexOf(k) > -1; });
      if (d.answers && typeof d.answers === "object") {
        KEYS.forEach(function (k) { if (typeof d.answers[k] === "string") st.answers[k] = d.answers[k]; });
      }
    }
  } catch (e) {}

  var hasClaude = !!(window.claude && typeof window.claude.use === "function");
  var backend = hasClaude ? "pending" : (FORM_ENDPOINT ? "endpoint" : "none");
  var db = null, isOwner = false, dbRefused = false;
  var view = "form", sending = false, statusErr = null;
  var responses = [], inboxState = "loading", gotSnap = false;
  var sendVisible = true;

  function hasAnswer() {
    return !!(st.main.trim() || st.picked.some(function (k) { return (st.answers[k] || "").trim(); }));
  }

  function hasDraft() {
    return !!(st.main.trim() || st.name.trim() || KEYS.some(function (k) { return (st.answers[k] || "").trim(); }));
  }

  function autosize(ta) {
    ta.style.height = "auto";
    if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 2 + "px";
  }

  // ---------- optional questions as tags (built once) ----------
  function buildTags() {
    var tags = $("tags");
    KEYS.forEach(function (k) {
      var b = el("button", "tag");
      b.type = "button";
      b.id = "t-" + k;
      b.setAttribute("aria-pressed", "false");
      var icon = el("span", "icon");
      icon.setAttribute("aria-hidden", "true");
      b.append(icon, el("span", "tl"));
      b.addEventListener("click", function () { togglePick(k); });
      tags.append(b);
    });
    renderAnswers();
  }

  function renderAnswers(freshKey) {
    var L = T[lang];
    KEYS.forEach(function (k) {
      var on = st.picked.indexOf(k) > -1;
      var tag = $("t-" + k);
      tag.setAttribute("aria-pressed", String(on));
      var a = $("a-" + k);
      if (on && !a) {
        a = el("div", "answer" + (k === freshKey ? " fresh" : ""));
        a.id = "a-" + k;
        var ta = el("textarea", "field");
        ta.id = "p-" + k;
        ta.maxLength = 4000;
        ta.value = st.answers[k] || "";
        ta.addEventListener("input", function () { st.answers[k] = ta.value; autosize(ta); changed(); });
        a.append(ta);
        tag.after(a);
      } else if (!on && a) {
        a.remove();
      }
    });
    st.picked.forEach(function (k) {
      var ta = $("p-" + k);
      ta.setAttribute("aria-label", L.prompts[k]);
      ta.placeholder = L.ph;
      autosize(ta);
    });
  }

  function togglePick(k) {
    var on = st.picked.indexOf(k) > -1;
    if (on) st.picked = st.picked.filter(function (x) { return x !== k; });
    else st.picked.push(k);
    renderAnswers(on ? null : k);
    if (on) {
      $("t-" + k).focus({ preventScroll: true });
    } else {
      var ta = $("p-" + k);
      ta.focus({ preventScroll: true });
      ta.closest(".answer").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    }
    changed();
  }

  // ---------- rotating starters in the main field ----------
  var starterIdx = 0, starterTimer = 0;
  function setStarter() { $("main").placeholder = t("starters")[starterIdx % t("starters").length]; }
  function startStarters() {
    clearInterval(starterTimer);
    setStarter();
    if (reduceMotion) return;
    starterTimer = setInterval(function () {
      if ($("main").value) return;
      starterIdx++;
      setStarter();
    }, 3200);
  }

  // ---------- rendering ----------
  function applyLang() {
    var L = T[lang], root = document.documentElement;
    root.lang = lang;
    root.dir = L.dir;
    document.querySelectorAll("[data-t]").forEach(function (n) {
      var v = L[n.getAttribute("data-t")];
      if (typeof v === "string") n.textContent = v;
    });
    document.querySelectorAll("[data-tp]").forEach(function (n) { n.placeholder = L[n.getAttribute("data-tp")]; });
    KEYS.forEach(function (k) { $("t-" + k).querySelector(".tl").textContent = L.prompts[k]; });
    renderAnswers();
    $("send").title = L.sendTitle;
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("lang-he").setAttribute("aria-pressed", String(lang === "he"));
    if (sending) { $("sendLabel").textContent = L.sending; $("dockLabel").textContent = L.sending; }
    startStarters();
    renderWho();
    renderStatus();
    updateInboxBtn();
    if (view === "inbox") renderInbox();
    if (view === "fallback") fillFallback();
  }

  function renderWho() {
    $("anon").checked = st.anon;
    $("name").hidden = st.anon;
    $("anonNote").textContent = st.anon ? t("anonOn") : t("anonOff");
  }

  function statusText() {
    if (statusErr) return t(statusErr);
    if (st.anon) return t("statusAnon");
    return st.name.trim() ? t("statusNamed") + st.name.trim() : t("statusNamedEmpty");
  }

  function renderStatus() {
    $("sendMeta").classList.toggle("is-err", !!statusErr);
    $("status").textContent = statusErr ? t(statusErr) : "";
    $("dockStatus").textContent = statusText();
    $("saved").hidden = !!statusErr || !hasDraft();
    updateDock();
  }

  function updateDock() {
    var show = view === "form" && hasAnswer() && !sendVisible && !sending;
    $("dock").classList.toggle("show", show);
  }

  var saveTimer = 0;
  function changed() {
    statusErr = null;
    if (hasAnswer()) $("errMain").hidden = true;
    renderStatus();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (hasDraft()) store.set(DRAFT_KEY, JSON.stringify(st));
      else store.del(DRAFT_KEY);
    }, 350);
  }

  function show(v) {
    view = v;
    $("formView").hidden = v !== "form";
    $("doneView").hidden = v !== "done";
    $("fallbackView").hidden = v !== "fallback";
    $("inboxView").hidden = v !== "inbox";
    updateInboxBtn();
    updateDock();
    if (v === "inbox") renderInbox();
    if (v === "form") {
      autosize($("main"));
      st.picked.forEach(function (k) { autosize($("p-" + k)); });
    }
    if (v === "fallback") autosize($("copyBox"));
    window.scrollTo(0, 0);
  }

  // ---------- submission ----------
  function buildPayload() {
    var answers = {};
    KEYS.forEach(function (k) {
      if (st.picked.indexOf(k) < 0) return;
      var v = (st.answers[k] || "").trim();
      if (v) answers[k] = v;
    });
    return {
      at: new Date().toISOString(),
      lang: lang,
      anonymous: st.anon,
      name: st.anon ? "" : st.name.trim().slice(0, 80),
      main: st.main.trim(),
      answers: answers,
      v: 4
    };
  }

  function flatten(p) {
    var E = T.en, o = {
      _subject: "Feedback for Guy",
      Sent: p.at,
      Language: p.lang,
      Anonymous: p.anonymous ? "yes" : "no",
      Name: p.name || "",
      General: p.main
    };
    KEYS.forEach(function (k) { o[E.prompts[k]] = p.answers[k] || ""; });
    return o;
  }

  function asText(p) {
    var L = T[lang], lines = [L.textTitle, ""];
    if (!p.anonymous && p.name) lines.push(p.name, "");
    lines.push(L.general, p.main);
    KEYS.forEach(function (k) { if (p.answers[k]) lines.push("", L.prompts[k], p.answers[k]); });
    return lines.join("\n");
  }

  var REFUSED = ["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "transform_error"];

  async function postToEndpoint(p) {
    var body = JSON.stringify(flatten(p));
    try {
      if (/script\.google(usercontent)?\.com/.test(FORM_ENDPOINT)) {
        // Google Apps Script: a simple text/plain POST; the response is opaque, so a completed request counts as sent.
        await fetch(FORM_ENDPOINT, { method: "POST", mode: "no-cors", body: body });
        return "ok";
      }
      var r = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: body
      });
      return r.ok ? "ok" : "error";
    } catch (e) { return "error"; }
  }

  async function deliver(p) {
    if (backend === "db" && db && !dbRefused) {
      var ref = db.collection("responses").doc();
      for (var i = 0; i < 2; i++) {
        try {
          await ref.set(p);
          return "ok";
        } catch (e) {
          var code = e && e.code;
          if (code === "unavailable" && i === 0) { await wait(500 + Math.random() * 700); continue; }
          if (code === "quota_exceeded") return "full";
          if (REFUSED.indexOf(code) > -1) {
            dbRefused = true;
            backend = FORM_ENDPOINT ? "endpoint" : "none";
            break;
          }
          return "error";
        }
      }
    }
    if (FORM_ENDPOINT) return postToEndpoint(p);
    return "nowhere";
  }

  var pendingText = "";
  function fillFallback() {
    if (!pendingText) pendingText = asText(buildPayload());
    $("copyBox").value = pendingText;
    $("fbAnon").hidden = !st.anon;
  }

  function setSending(on) {
    sending = on;
    $("send").disabled = on;
    $("dockSend").disabled = on;
    $("sendLabel").textContent = on ? t("sending") : t("send");
    $("dockLabel").textContent = on ? t("sending") : t("send");
    updateDock();
  }

  function resetAnswers() {
    store.del(DRAFT_KEY);
    st.main = "";
    st.answers = {};
    $("main").value = "";
    st.picked = [];
    renderAnswers();
    statusErr = null;
    renderStatus();
  }

  async function onSubmit(e) {
    if (e) e.preventDefault();
    if (sending) return;
    var bad = null;
    $("errName").hidden = true;
    $("errMain").hidden = true;
    if (!hasAnswer()) {
      $("errMain").textContent = t("errMain");
      $("errMain").hidden = false;
      bad = $("main");
    }
    if (!st.anon && !st.name.trim()) {
      $("errName").textContent = t("errName");
      $("errName").hidden = false;
      bad = bad || $("name");
    }
    if (bad) {
      bad.focus({ preventScroll: true });
      bad.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
      return;
    }
    if ($("hp").value) { resetAnswers(); show("done"); return; }
    setSending(true);
    await ready;
    var payload = buildPayload();
    var res = await deliver(payload);
    setSending(false);
    if (res === "ok") {
      resetAnswers();
      show("done");
    } else if (res === "nowhere") {
      pendingText = asText(payload);
      fillFallback();
      $("copyHint").hidden = true;
      renderStatus();
      show("fallback");
    } else {
      statusErr = res === "full" ? "errFull" : "errSend";
      renderStatus();
    }
  }

  function copyText(text, onOk, onFail) {
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("no clipboard");
      navigator.clipboard.writeText(text).then(onOk, onFail);
    } catch (e) { onFail(); }
  }

  // ---------- owner inbox (inside Claude only) ----------
  function updateInboxBtn() {
    var b = $("inboxBtn");
    if (!isOwner || !db) { b.hidden = true; $("hdrLabel").hidden = false; return; }
    b.hidden = false;
    $("hdrLabel").hidden = true;
    $("inboxBtnLabel").textContent = view === "inbox" ? t("inboxBack") : t("inboxBtn");
  }

  function renderInbox() {
    var L = T[lang], list = $("list");
    list.textContent = "";
    $("inboxActions").hidden = responses.length === 0;
    if (!responses.length) {
      var msg = inboxState === "ready" ? L.inboxEmpty : inboxState === "loading" ? L.inboxLoading : L.inboxSlow;
      list.append(el("p", "empty", msg));
      return;
    }
    if (inboxState === "slow" || inboxState === "error") list.append(el("p", "empty", L.inboxSlow));
    var fmt;
    try { fmt = new Intl.DateTimeFormat(L.locale, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { fmt = null; }
    var total = responses.length;
    responses.forEach(function (r, i) {
      var card = el("article", "resp");
      var meta = el("div", "resp-meta meta");
      meta.append(el("span", "", pad(total - i)));
      var dt = new Date(r.at);
      if (fmt && !isNaN(dt.getTime())) meta.append(el("span", "", fmt.format(dt)));
      card.append(meta);
      var named = !r.anonymous && typeof r.name === "string" && r.name.trim();
      var who = el("p", "resp-who h2" + (named ? "" : " anon"), named ? r.name : L.anonName);
      who.dir = "auto";
      card.append(who);
      if (typeof r.main === "string" && r.main) {
        var p = el("p", "resp-main", r.main);
        p.dir = "auto";
        card.append(p);
      }
      var ans = r.answers && typeof r.answers === "object" ? r.answers : {};
      KEYS.forEach(function (k) {
        if (typeof ans[k] !== "string" || !ans[k].trim()) return;
        var row = el("div", "resp-a");
        var v = el("p", "v", ans[k]);
        v.dir = "auto";
        row.append(el("div", "meta", L.prompts[k]), v);
        card.append(row);
      });
      list.append(card);
    });
  }

  function inboxText() {
    var L = T[lang];
    return responses.map(function (r) {
      var named = !r.anonymous && r.name;
      var lines = [(named ? r.name : L.anonName) + (r.at ? " · " + String(r.at).slice(0, 10) : ""), "", L.general, r.main || ""];
      var ans = r.answers || {};
      KEYS.forEach(function (k) { if (ans[k]) lines.push("", L.prompts[k], ans[k]); });
      return lines.join("\n");
    }).join("\n\n────────\n\n");
  }

  function startInbox() {
    updateInboxBtn();
    var timer = setTimeout(function () {
      if (inboxState === "loading") {
        inboxState = "slow";
        if (view === "inbox") renderInbox();
      }
    }, 10000);
    try {
      db.collection("responses").orderBy("at", "desc").limit(500).onSnapshot(function (snap) {
        gotSnap = true;
        responses = snap.docs.filter(function (d) { return d.exists; }).map(function (d) {
          var b = d.data() || {};
          return { id: d.id, at: b.at, name: b.name, anonymous: b.anonymous, main: b.main, answers: b.answers };
        });
        if (!snap.metadata.fromCache) { clearTimeout(timer); inboxState = "ready"; }
        updateInboxBtn();
        if (view === "inbox") renderInbox();
      }, function () {
        clearTimeout(timer);
        inboxState = "error";
        if (view === "inbox") renderInbox();
      });
    } catch (e) {
      clearTimeout(timer);
      inboxState = "error";
    }
  }

  // ---------- Claude runtime (ignored on GitHub Pages) ----------
  async function init() {
    if (!hasClaude) return;
    var user = null;
    try {
      var got = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      db = got[0];
      user = got[1];
    } catch (e) { db = null; }
    var canWrite = null;
    if (user) {
      try { isOwner = await user.isOwner(); } catch (e) {}
      try { canWrite = await user.can("data.write"); } catch (e) {}
    }
    backend = db && canWrite !== false ? "db" : (FORM_ENDPOINT ? "endpoint" : "none");
    renderStatus();
    if (isOwner && db) startInbox();
  }
  var ready = init().catch(function () {
    backend = FORM_ENDPOINT ? "endpoint" : "none";
    renderStatus();
  });

  // ---------- wiring ----------
  $("themeBtn").addEventListener("click", function () {
    var light = document.documentElement.getAttribute("data-theme") !== "light";
    if (light) document.documentElement.setAttribute("data-theme", "light"); else document.documentElement.removeAttribute("data-theme");
    store.set("gf-theme", light ? "light" : "dark");
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", light ? "#FFFFFF" : "#000000");
    var c = document.querySelector('meta[name="color-scheme"]'); if (c) c.setAttribute("content", light ? "light" : "dark");
  });
  function toggleLang() { lang = lang === "en" ? "he" : "en"; store.set(LANG_KEY, lang); applyLang(); }
  $("lang-en").addEventListener("click", toggleLang);
  $("lang-he").addEventListener("click", toggleLang);

  $("anon").addEventListener("change", function () {
    st.anon = $("anon").checked;
    renderWho();
    if (st.anon) $("errName").hidden = true;
    else $("name").focus({ preventScroll: true });
    changed();
  });
  $("name").addEventListener("input", function () {
    st.name = $("name").value;
    if (st.name.trim()) $("errName").hidden = true;
    changed();
  });
  $("main").addEventListener("input", function () {
    st.main = $("main").value;
    autosize($("main"));
    changed();
  });
  $("form").addEventListener("submit", onSubmit);
  $("dockSend").addEventListener("click", function () { onSubmit(); });
  document.addEventListener("keydown", function (e) {
    if (view === "form" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); onSubmit(); }
  });

  // docked Send: only when the main Send is off screen
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      sendVisible = entries[0].isIntersecting;
      updateDock();
    }).observe($("send"));
  }
  // keep the dock out of the way while the on-screen keyboard is up
  function isField(n) { return n && n.matches && n.matches("textarea:not([readonly]), input[type=text]"); }
  document.addEventListener("focusin", function (e) { if (coarse.matches && isField(e.target)) document.body.classList.add("typing"); });
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (!isField(document.activeElement)) document.body.classList.remove("typing"); }, 80);
  });

  $("againBtn").addEventListener("click", function () { show("form"); $("main").focus({ preventScroll: true }); });
  $("backBtn").addEventListener("click", function () { pendingText = ""; show("form"); });
  $("copyBtn").addEventListener("click", function () {
    var box = $("copyBox");
    copyText(box.value, function () {
      $("copyLabel").textContent = t("copied");
      setTimeout(function () { $("copyLabel").textContent = t("copy"); }, 1800);
    }, function () {
      box.focus();
      box.select();
      $("copyHint").textContent = t("copyFail");
      $("copyHint").hidden = false;
    });
  });
  $("inboxBtn").addEventListener("click", function () { show(view === "inbox" ? "form" : "inbox"); });
  $("copyAllBtn").addEventListener("click", function () {
    copyText(inboxText(), function () {
      $("copyAllLabel").textContent = t("copied");
      setTimeout(function () { $("copyAllLabel").textContent = t("copyAll"); }, 1800);
    }, function () {
      $("copyAllLabel").textContent = t("copyBlocked");
      setTimeout(function () { $("copyAllLabel").textContent = t("copyAll"); }, 2400);
    });
  });

  // ---------- boot ----------
  buildTags();
  $("name").value = st.name;
  $("main").value = st.main;
  applyLang();
  autosize($("main"));
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      autosize($("main"));
      st.picked.forEach(function (k) { autosize($("p-" + k)); });
    });
  }
})();
</script>
</body>
</html>
